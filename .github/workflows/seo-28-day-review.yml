name: SEO 28-day review reminder

on:
  schedule:
    # The 2026-10-08 anchor is a Thursday; every fourth Thursday is exactly 28 days later.
    - cron: "20 3 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-28-day-review-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Create the due review issue once
        uses: actions/github-script@v7
        env:
          REVIEW_ANCHOR_DATE: "2026-10-08"
        with:
          script: |
            const dayMs = 24 * 60 * 60 * 1000;
            const anchor = new Date(`${process.env.REVIEW_ANCHOR_DATE}T00:00:00Z`);
            const today = new Date();
            const elapsedDays = Math.floor((today - anchor) / dayMs);
            const cycle = Math.floor(elapsedDays / 28);

            if (cycle < 1) {
              core.info("The first 28-day review is not due yet.");
              return;
            }

            const due = new Date(anchor.getTime() + cycle * 28 * dayMs);
            const dueDate = due.toISOString().slice(0, 10);
            const title = `SEO 28-day review: ${dueDate}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });

            if (issues.some((issue) => issue.title === title)) {
              core.info(`${title} already exists.`);
              return;
            }

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "seo-28-day-review",
                color: "1d76db",
                description: "Recurring 28-day SEO review",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["seo-28-day-review"],
              body: [
                "本次只比较完整的 28 天窗口，不根据单日排名波动修改页面。",
                "",
                "- [ ] 导出完全匹配 `billybobgames` 的 Search Console 最近 28 天数据",
                "- [ ] 导出已收录页面或记录收录数量",
                "- [ ] 导出外链网站域名",
                "- [ ] 运行 `pnpm seo:review -- --current \"/导出目录\"`",
                "- [ ] 比较点击、展示、CTR、平均排名、国家和设备",
                "- [ ] 记录新增收录页面和新增外链域名",
                "- [ ] 只根据完整周期趋势决定下一项工作",
                "",
                "详细步骤：`docs/seo-28-day-review.md`",
              ].join("\n"),
            });
