name: Publish one reviewed game weekly

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: billybobgames-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the highest-ranked reviewed game
        id: release
        run: node scripts/weekly-game-release.mjs select >> "$GITHUB_OUTPUT"

      - name: Explain an empty release queue
        if: steps.release.outputs.has_ready != 'true'
        run: echo "No reviewed game is marked ready; nothing will be deployed."

      - name: Check publication safeguards
        if: steps.release.outputs.has_ready == 'true'
        run: pnpm game:check

      - name: Build Cloudflare Worker
        if: steps.release.outputs.has_ready == 'true'
        run: pnpm run build:vinext

      - name: Deploy one reviewed game
        if: steps.release.outputs.has_ready == 'true'
        run: pnpm run deploy:vinext
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record successful publication
        if: steps.release.outputs.has_ready == 'true'
        run: node scripts/weekly-game-release.mjs mark --route "${{ steps.release.outputs.route }}"

      - name: Commit release record
        if: steps.release.outputs.has_ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game-queue.md data/game-release-log.json
          git commit -m "chore: record weekly game release ${{ steps.release.outputs.route }}"
          git push
